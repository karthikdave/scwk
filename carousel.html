<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SCWK Carousel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QDEN6YVJ4Y"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-QDEN6YVJ4Y');
</script>

<style>
body {
  background: linear-gradient(to bottom, #eff6ff, #ffffff);
}
</style>
</head>

<body class="font-sans text-gray-900">

<header class="bg-white shadow px-6 py-4 text-center">
  <img src="images/logo.png" class="h-14 mx-auto mb-3">

  <nav class="flex justify-center gap-4 text-sm">
    <a href="index.html" class="px-4 py-2 rounded-full hover:bg-blue-100">Home</a>
    <a href="bites.html" class="px-4 py-2 rounded-full hover:bg-blue-100">Bites</a>
    <a href="lites.html" class="px-4 py-2 rounded-full hover:bg-blue-100">Lites</a>
  </nav>
</header>

<!-- KEEP YOUR EXISTING STRUCTURE -->
<section class="max-w-xl mx-auto px-6 pt-20 text-center">

  <!-- IMAGE -->
  <img id="slideImage" src="" class="rounded-xl shadow-md mx-auto mb-6">

  <!-- CONTROLS -->
  <div class="flex justify-center gap-4 mb-4">
    <button onclick="prevSlide()" class="px-4 py-2 bg-gray-200 rounded">⬅</button>
    <button onclick="nextSlide()" class="px-4 py-2 bg-gray-200 rounded">➡</button>
  </div>

  <!-- ✅ SHARE (ONLY ADDITION) -->
  <button onclick="sharePage(event)"
    class="text-sm text-blue-600 hover:underline">
    🔗 Share
  </button>

</section>

<section class="py-10 text-center text-sm text-gray-400">
  Scrum & Coffee with Karthik • SCWK © 2026
</section>

<script>
const params = new URLSearchParams(window.location.search);
const folder = params.get('folder');

let current = 1;
let total = 10;

function loadSlide() {
  const img = document.getElementById("slideImage");
  const prefix = folder.includes('bites') ? 'b' : 'l';
  const path = `images/${folder}/${prefix}${current}.png`;

  img.src = path;

  img.onerror = () => {
    total = current - 1;
    if (current > total) current = total;
    img.src = `images/${folder}/${prefix}${current}.png`;
  };
}

function nextSlide() {
  if (current < total) {
    current++;
    loadSlide();
  }
}

function prevSlide() {
  if (current > 1) {
    current--;
    loadSlide();
  }
}

/* ✅ SHARE FUNCTION (ONLY ADDITION) */
function sharePage(e) {
  if (e) e.stopPropagation();

  const url = window.location.href;

  if (navigator.share) {
    navigator.share({
      title: document.title,
      url: url
    });
  } else {
    navigator.clipboard.writeText(url);
    alert("Link copied!");
  }
}

loadSlide();
</script>

</body>
</html>
