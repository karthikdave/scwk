<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCWK Viewer</title>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0f172a;
  color: #fff;
  overflow: hidden;
}

#viewer {
  position: relative;
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#loader {
  position: absolute;
  text-align: center;
  color: #38BDF8;
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(56,189,248,0.2);
  border-top: 3px solid #38BDF8;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

#slide {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;
  display: none;
}

.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 26px;
  cursor: pointer;
  padding: 10px;
  color: rgba(255,255,255,0.3);
  transition: all 0.2s ease;
}

.nav:hover {
  color: #38BDF8;
  transform: translateY(-50%) scale(1.2);
}

#prev { left: 10px; }
#next { right: 10px; }

#counter {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 13px;
  color: #94a3b8;
}

#dots {
  position: absolute;
  top: 35px;
  right: 15px;
  display: flex;
  gap: 6px;
}

.dot {
  width: 6px;
  height: 6px;
  background: #64748b;
  border-radius: 50%;
}

.dot.active {
  background: #38BDF8;
  transform: scale(1.4);
}
</style>
</head>

<body>

<div id="viewer">

  <div id="loader">
    <div class="spinner"></div>
    <div style="margin-top:8px;">Loading...</div>
  </div>

  <img id="slide">

  <div id="prev" class="nav">&#10094;</div>
  <div id="next" class="nav">&#10095;</div>

  <div id="counter"></div>
  <div id="dots"></div>

</div>

<script>

// PARAMS
const params = new URLSearchParams(window.location.search);
let folder = params.get("folder");

if (folder && !folder.startsWith("images/")) {
  folder = "images/" + folder;
}

// Detect type
let prefix = "b";
let sourcePage = "index.html";

if (folder.includes("lites")) {
  prefix = "l";
  sourcePage = "lites.html";
}
if (folder.includes("bites")) {
  prefix = "b";
  sourcePage = "bites.html";
}

// STATE
let current = 0;
let images = [];
const MAX_CHECK = 20; // safe upper limit

// ELEMENTS
const loader = document.getElementById("loader");
const slide = document.getElementById("slide");
const dotsContainer = document.getElementById("dots");
const counter = document.getElementById("counter");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

// 🔥 GAP SAFE LOAD
function loadImages() {
  let checked = 0;
  let loaded = 0;

  for (let i = 1; i <= MAX_CHECK; i++) {
    let img = new Image();
    let png = `${folder}/${prefix}${i}.png`;
    let jpg = `${folder}/${prefix}${i}.jpg`;

    img.src = png;

    img.onload = function () {
      images[i - 1] = png;
      loaded++;
      checkDone();
    };

    img.onerror = function () {
      let fallback = new Image();
      fallback.src = jpg;

      fallback.onload = function () {
        images[i - 1] = jpg;
        loaded++;
        checkDone();
      };

      fallback.onerror = function () {
        checkDone();
      };
    };
  }

  function checkDone() {
    checked++;
    if (checked === MAX_CHECK) {
      images = images.filter(Boolean); // remove gaps
      init();
    }
  }
}

// INIT
function init() {
  if (images.length === 0) {
    loader.innerText = "No images found";
    return;
  }

  loader.style.display = "none";
  slide.style.display = "block";

  createDots();
  showSlide(0);
}

// SHOW
function showSlide(index) {
  current = index;
  slide.src = images[index];

  counter.innerText = `${index + 1} / ${images.length}`;

  document.querySelectorAll(".dot").forEach((d, i) => {
    d.classList.toggle("active", i === index);
  });

  prevBtn.style.display = (index === 0) ? "none" : "block";
  nextBtn.style.display = (index === images.length - 1) ? "none" : "block";
}

// NAV
prevBtn.onclick = () => { if (current > 0) showSlide(current - 1); };
nextBtn.onclick = () => { if (current < images.length - 1) showSlide(current + 1); };

// KEYBOARD
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" && current > 0) showSlide(current - 1);
  if (e.key === "ArrowRight" && current < images.length - 1) showSlide(current + 1);
  if (e.key === "Escape") window.location.href = sourcePage;
});

// DOTS
function createDots() {
  dotsContainer.innerHTML = "";
  images.forEach((_, i) => {
    let d = document.createElement("div");
    d.className = "dot";
    d.onclick = () => showSlide(i);
    dotsContainer.appendChild(d);
  });
}

// START
loadImages();

</script>

</body>
</html>
