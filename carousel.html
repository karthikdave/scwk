<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SCWK Carousel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(to bottom, #eff6ff, #ffffff);
  overflow: hidden; /* prevents unwanted scroll */
}

.dot {
  height: 8px;
  width: 8px;
  background-color: #d1d5db;
  border-radius: 50%;
  display: inline-block;
}
.dot.active {
  background-color: #2563eb;
}
</style>
</head>

<body class="font-sans text-gray-900 flex flex-col h-screen">

<!-- HEADER -->
<header class="bg-white shadow px-6 py-4 text-center">
  <img src="images/logo.png" class="h-14 mx-auto mb-3">

  <nav class="flex justify-center gap-4 text-sm">
    <a href="index.html" class="px-4 py-2 rounded-full hover:bg-blue-100">Home</a>
    <a href="bites.html" class="px-4 py-2 rounded-full hover:bg-blue-100">Bites</a>
    <a href="lites.html" class="px-4 py-2 rounded-full hover:bg-blue-100">Lites</a>
    <a href="about.html" class="px-4 py-2 rounded-full hover:bg-blue-100">About</a>
  </nav>
</header>

<!-- CAROUSEL -->
<main class="flex-1 flex items-center justify-center">

  <div class="w-full max-w-md text-center px-4">

    <!-- DOTS -->
    <div id="dotsContainer" class="flex justify-center gap-2 mb-3"></div>

    <!-- IMAGE -->
    <img id="slideImage"
         class="rounded-xl shadow-md mx-auto mb-4 max-h-[60vh] object-contain">

    <!-- PAGE -->
    <div id="pageNumber" class="text-sm text-gray-500 mb-3"></div>

    <!-- CONTROLS -->
    <div class="flex justify-center gap-4">
      <button onclick="prevSlide()" class="px-4 py-2 bg-gray-200 rounded">⬅</button>
      <button onclick="nextSlide()" class="px-4 py-2 bg-gray-200 rounded">➡</button>
    </div>

  </div>

</main>

<!-- FOOTER -->
<footer class="py-4 text-center text-sm text-gray-400">
  Scrum & Coffee with Karthik • SCWK © 2026
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const folder = params.get('folder');

let current = 1;
let total = 0;
let prefix = folder.includes('bites') ? 'b' : 'l';

/* detect slides */
function detectTotalSlides(cb) {
  let i = 1;

  function check() {
    const img = new Image();
    img.src = `images/${folder}/${prefix}${i}.png`;

    img.onload = () => {
      i++;
      check();
    };

    img.onerror = () => {
      total = i - 1;
      cb();
    };
  }

  check();
}

function loadSlide() {
  document.getElementById("slideImage").src =
    `images/${folder}/${prefix}${current}.png`;

  updateUI();
}

function nextSlide() {
  if (current < total) {
    current++;
    loadSlide();
  }
}

function prevSlide() {
  if (current > 1) {
    current--;
    loadSlide();
  }
}

function updateUI() {
  document.getElementById("pageNumber").innerText =
    `${current} / ${total}`;

  const dots = document.querySelectorAll(".dot");
  dots.forEach((d, i) => {
    d.classList.toggle("active", i + 1 === current);
  });
}

function renderDots() {
  const c = document.getElementById("dotsContainer");
  c.innerHTML = "";

  for (let i = 1; i <= total; i++) {
    const d = document.createElement("span");
    d.className = "dot";
    if (i === current) d.classList.add("active");

    d.onclick = () => {
      current = i;
      loadSlide();
    };

    c.appendChild(d);
  }
}

/* init */
detectTotalSlides(() => {
  renderDots();
  loadSlide();
});
</script>

</body>
</html>
