<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCWK Viewer</title>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0f172a;
  color: #fff;
}

/* Container */
#content-container {
  position: relative;
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

/* Loader */
#loader {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #38BDF8;
  z-index: 10;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(56, 189, 248, 0.2);
  border-top: 3px solid #38BDF8;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Content */
#content {
  opacity: 0;
  transition: opacity 0.3s ease;
}

img {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 12px;
}
</style>

</head>

<body>

<div id="content-container">

  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
    <div style="margin-top:10px; font-size:14px;">Loading...</div>
  </div>

  <!-- Content -->
  <div id="content"></div>

</div>

<script>

// =========================
// PARAM HANDLING
// =========================
const urlParams = new URLSearchParams(window.location.search);
let folder = urlParams.get("folder");
const count = parseInt(urlParams.get("count")) || 6;

// Ensure correct base path
if (folder && !folder.startsWith("images/")) {
  folder = "images/" + folder;
}

// =========================
// LOAD FUNCTION
// =========================
function loadContent(folderPath, totalImages) {

  const loader = document.getElementById("loader");
  const content = document.getElementById("content");

  loader.style.display = "block";
  content.style.opacity = 0;
  content.innerHTML = "";

  let loaded = 0;

  function checkDone() {
    if (loaded === totalImages) {
      loader.style.display = "none";
      content.style.opacity = 1;
    }
  }

  for (let i = 1; i <= totalImages; i++) {

    let img = new Image();

    // Try PNG first
    img.src = `${folderPath}/b${i}.png`;

    img.onload = function () {
      loaded++;
      checkDone();
    };

    img.onerror = function () {
      // fallback to JPG
      img.onerror = function () {
        console.log("Failed:", img.src);
        loaded++;
        checkDone();
      };
      img.src = `${folderPath}/b${i}.jpg`;
    };

    content.appendChild(img);
  }
}

// =========================
// TRIGGER
// =========================
if (folder) {
  loadContent(folder, count);
}

</script>

</body>
</html>
