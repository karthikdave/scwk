<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SCWK Carousel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(to bottom, #eff6ff, #ffffff);
}
.dot {
  height: 8px;
  width: 8px;
  background-color: #d1d5db;
  border-radius: 50%;
  display: inline-block;
}
.dot.active {
  background-color: #2563eb;
}
</style>
</head>

<body class="font-sans text-gray-900">

<header class="bg-white shadow px-6 py-4 text-center">
  <img src="images/logo.png" class="h-14 mx-auto mb-3">

  <nav class="flex justify-center gap-4 text-sm">
    <a href="index.html" class="px-4 py-2 rounded-full hover:bg-blue-100">Home</a>
    <a href="bites.html" class="px-4 py-2 rounded-full hover:bg-blue-100">Bites</a>
    <a href="lites.html" class="px-4 py-2 rounded-full hover:bg-blue-100">Lites</a>
  </nav>
</header>

<section class="max-w-xl mx-auto px-6 pt-20 text-center">

  <!-- DOTS (TOP - FIXED) -->
  <div id="dotsContainer" class="flex justify-center gap-2 mb-4"></div>

  <!-- IMAGE -->
  <img id="slideImage" src="" class="rounded-xl shadow-md mx-auto mb-6">

  <!-- PAGE -->
  <div id="pageNumber" class="text-sm text-gray-500 mb-4"></div>

  <!-- CONTROLS -->
  <div class="flex justify-center gap-4">
    <button onclick="prevSlide()" class="px-4 py-2 bg-gray-200 rounded">⬅</button>
    <button onclick="nextSlide()" class="px-4 py-2 bg-gray-200 rounded">➡</button>
  </div>

</section>

<section class="py-10 text-center text-sm text-gray-400">
  Scrum & Coffee with Karthik • SCWK © 2026
</section>

<script>
const params = new URLSearchParams(window.location.search);
const folder = params.get('folder');

let current = 1;
let total = 0;
let prefix = folder.includes('bites') ? 'b' : 'l';

function detectTotalSlides(callback) {
  let i = 1;

  function check() {
    const img = new Image();
    img.src = `images/${folder}/${prefix}${i}.png`;

    img.onload = () => {
      i++;
      check();
    };

    img.onerror = () => {
      total = i - 1;
      callback();
    };
  }

  check();
}

function loadSlide() {
  const img = document.getElementById("slideImage");
  img.src = `images/${folder}/${prefix}${current}.png`;

  updatePage();
  highlightDot();
}

function nextSlide() {
  if (current < total) {
    current++;
    loadSlide();
  }
}

function prevSlide() {
  if (current > 1) {
    current--;
    loadSlide();
  }
}

function updatePage() {
  document.getElementById("pageNumber").innerText = `${current} / ${total}`;
}

function renderDots() {
  const container = document.getElementById("dotsContainer");
  container.innerHTML = "";

  for (let i = 1; i <= total; i++) {
    const dot = document.createElement("span");
    dot.classList.add("dot");

    if (i === current) dot.classList.add("active");

    dot.onclick = () => {
      current = i;
      loadSlide();
    };

    container.appendChild(dot);
  }
}

function highlightDot() {
  const dots = document.querySelectorAll(".dot");
  dots.forEach((dot, index) => {
    dot.classList.toggle("active", index + 1 === current);
  });
}

/* INIT */
detectTotalSlides(() => {
  renderDots();
  loadSlide();
});
</script>

</body>
</html>
